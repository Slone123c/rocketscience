name: windows-core

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  core-systemproxy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Seed bundled GEO databases for tests
        shell: pwsh
        run: |
          $geoDir = Join-Path $env:APPDATA "RocketScience\geo"
          New-Item -ItemType Directory -Force -Path $geoDir | Out-Null
          Copy-Item resources\geoip.metadb, resources\geosite.dat $geoDir
      - name: Run full Go test suite
        run: go test ./... -count=1
        env:
          GOFLAGS: -tags=with_gvisor
      - name: Live WinINET apply/restore on ephemeral runner
        run: go test ./internal/systemproxy/ -run LiveWinINET -count=1 -v
        env:
          GOFLAGS: -tags=with_gvisor
      - name: Build Windows application binary
        run: go build -tags=with_gvisor -trimpath -o rocketscience.exe .
